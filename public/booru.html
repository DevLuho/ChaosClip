<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChaosBooru</title>
<!-- Page d'édition ChaosBooru, affichée dans la fenêtre de ChaosClip. Les styles et le rendu de l'éditeur viennent du site
     lui-même (miroir /site, lib/site.js) ; site-base.css est le peu du socle du site dont cette page dépend. -->
<link rel="stylesheet" href="booru-site/site-base.css">
<link rel="stylesheet" href="/site/assets/css/chaosbooru.css">
<style>
  .booru-send-feedback { display: flex; align-items: center; flex-wrap: wrap; gap: .45rem; font-size: .85rem; }
  .booru-send-feedback progress { width: 4rem; }
  /* Le panneau ChaosBoo du site utilise le .chaos-spinner de splash.css, que cette page ne charge pas. */
  .chaos-spinner { display: inline-block; flex: none; }
  .booru-send-spinner, .chaos-spinner { width: 13px; height: 13px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: send-spin .8s linear infinite; }
  [aria-disabled=true] { cursor: wait; }
  @keyframes send-spin { to { transform: rotate(1turn); } }
  @media (prefers-reduced-motion: reduce) { .booru-send-spinner, .chaos-spinner { animation: none; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="js/booru-page.js"></script>
</body>
</html>
