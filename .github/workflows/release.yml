# Installateur Windows publié sur GitHub Releases, où l'appli installée va chercher ses mises à jour.
# Lancement : Actions › Release › Run workflow (crée le tag vX.Y.Z de package.json), ou pousser ce tag.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag de la version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          git tag "$v" && git push origin "$v"
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
