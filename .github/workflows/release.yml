# Installateur Windows publié sur GitHub Releases, où l'appli installée va chercher ses mises à jour.
# Lancement : Actions › Release › Run workflow (crée le tag vX.Y.Z de package.json), ou pousser ce tag.
# Appli Android : une fois la release créée, « npm run apk » sur le PC qui détient la clé de signature
# construit les APK et les joint à la release ; l'appli installée y trouve alors sa mise à jour.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique et tags : notes de version depuis le tag précédent
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag de la version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          git ls-remote --exit-code --tags origin "$v" >/dev/null || { git tag "$v" && git push origin "$v"; }
      # Une seule release par tag : sinon les envois parallèles d'electron-builder en créent deux
      # et la mise à jour automatique ne trouve plus latest.yml.
      - name: Release unique pour le tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          for id in $(gh api "repos/${{ github.repository }}/releases" --jq ".[] | select(.tag_name==\"$v\") | .id" | tail -n +2); do
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
          done
          prev="$(git describe --tags --abbrev=0 "$v^" 2>/dev/null || true)"
          git log --no-merges --format='- %s' "${prev:+$prev..}$v" > notes.md
          gh release view "$v" >/dev/null 2>&1 || gh release create "$v" --title "$v" --notes-file notes.md --draft
      - run: npm ci
      # Les tests passent avec le ffmpeg livré dans l'appli (build/ffmpeg.js).
      - run: node build/ffmpeg.js
      - run: npm test
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Brouillon jusqu'ici : sans ça, l'appli installée voit la release avant latest.yml et échoue en 404.
      - name: Publier la release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v$(node -p "require('./package.json').version")" --draft=false --latest
