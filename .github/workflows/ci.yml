name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Installateur de test, téléchargeable depuis la page du run (onglet Artifacts).
      - if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish never
      - if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ChaosClip-Setup
          path: dist/*.exe
          retention-days: 7
